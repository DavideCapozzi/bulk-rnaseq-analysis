$schema: "https://json-schema.org/draft/2020-12/schema"
# Validated by snakemake.utils.validate (defaults are filled in); bulkrnaseq::read_config() fills the same defaults
# and validate_config() checks the cross-field rules. The only place where defaults live (see with_defaults()).
# Sections of modules that are implemented are strict (additionalProperties: false).
description: Project configuration for the bulkrnaseq toolkit.
type: object
additionalProperties: false
required: [project, toolkit, inputs]
# samples is required whenever a sample-level input (counts, abundance, normalized, coverage, qc) is
# configured; bulkrnaseq::validate_config() enforces this cross-field rule.

$defs:
  file_or_pattern:
    description: >
      Path relative to inputs.base_dir. May contain the placeholder {input}, replaced by each value of the
      sample sheet column input_column (one file per sample).
    type: string
  gene_list_ref:
    description: Key of a gene list in resources.gene_lists, or an inline list of gene symbols.
    oneOf:
      - type: string
      - type: array
        items: {type: string}
  seed:
    type: integer
    minimum: 0
  threshold_list:
    type: array
    items: {type: number, minimum: 0}

properties:
  project:
    type: object
    additionalProperties: false
    required: [name, output_dir]
    properties:
      name: {type: string, pattern: "^[a-z0-9_]+$", description: Short project identifier (snake_case).}
      organism: {type: string, enum: [human], default: human, description: Key of inst/organisms.yaml.}
      output_dir: {type: string, description: Output folder; relative paths resolve against the config file.}
      seed: {$ref: "#/$defs/seed", default: 1, description: Default seed for every random step.}

  toolkit:
    type: object
    additionalProperties: false
    required: [version]
    description: >
      Toolkit release this config is written for. The workflow stops before running when it differs from the
      Version field of the checked-out DESCRIPTION or when the checkout has uncommitted changes; development
      mode (BULKRNASEQ_DEV=1, bulkrnaseq run --dev) turns both into warnings recorded in the run manifest.
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$", description: "Toolkit version, e.g. 0.1.0."}

  samples:
    type: object
    additionalProperties: false
    required: [sheet]
    properties:
      sheet:
        type: string
        description: >
          TSV with at least sample_id and input_column. sample_id is the identifier used in every output;
          input_column links the sample to a file ({input} placeholder) or to a column of a matrix input.
          Other columns are sample metadata; metadata is never parsed from names.
          Optional column inputs_available (comma-separated data levels, default: all configured) marks samples
          present only in some inputs, e.g. 'qc' for libraries with QC reports but no counts.
      factors:
        description: Sample sheet columns used as experimental factors, with level order (reference first).
        type: object
        additionalProperties:
          type: array
          items: {type: string}
        default: {}
      label_column:
        type: string
        description: Optional sample sheet column used as plot label.

  inputs:
    type: object
    additionalProperties: false
    properties:
      base_dir: {type: string, description: Folder all input paths are relative to.}
      counts:
        type: object
        additionalProperties: false
        required: [adapter]
        properties:
          adapter: {type: string, enum: [star_reads_per_gene, matrix]}
          files: {$ref: "#/$defs/file_or_pattern"}
          file: {type: string}
          sheet: {type: [string, "null"], default: null}
          id_column: {type: string}
          strand_column:
            type: string
            enum: [unstranded, forward, reverse, single]
            default: single
            description: >
              STAR ReadsPerGene.out.tab has 4 columns (unstranded, forward, reverse); 'single' is for the
              2-column 'deseq2-ready' files where the provider already chose the strand.
          on_duplicate: {type: string, enum: [error, sum, first], default: error}
      abundance:
        type: object
        additionalProperties: false
        required: [adapter]
        properties:
          adapter: {type: string, enum: [stringtie_gene_abundance, matrix]}
          files: {$ref: "#/$defs/file_or_pattern"}
          file: {type: string}
          sheet: {type: [string, "null"], default: null}
          id_column: {type: string}
          kind: {type: string, enum: [tpm, fpkm], description: For the matrix adapter only.}
          on_duplicate: {type: string, enum: [error, sum, first], default: error}
      normalized:
        type: object
        additionalProperties: false
        required: [adapter, file, id_column]
        properties:
          adapter: {type: string, enum: [matrix]}
          file: {type: string}
          sheet: {type: [string, "null"], default: null}
          id_column: {type: string}
          description: {type: string, description: How the provider normalised (free text, copied to the ingest report).}
      contrast_tables:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, adapter, file]
          properties:
            id: {type: string, pattern: "^[A-Za-z0-9_]+$"}
            adapter: {type: string, enum: [deseq2, noiseq, generic]}
            file: {type: string}
            sheet: {type: [string, "null"], default: null}
            columns:
              description: Mapping canonical column -> input column; required for 'generic'.
              type: object
              additionalProperties: {type: string}
            numerator: {type: string}
            denominator: {type: string}
            df_residual: {type: [integer, "null"], default: null}
      coverage:
        type: object
        additionalProperties: false
        required: [files]
        properties:
          adapter: {type: string, enum: [bedgraph], default: bedgraph}
          files:
            description: Pattern with {input}, {multiplicity} and {strand_file}.
            type: string
          multiplicity: {type: array, items: {type: string}, default: [Unique]}
          strand_files:
            description: Map strand_file token -> genomic strand ('+'/'-'), or 'auto' to infer it from strand_reference_genes.
            oneOf:
              - {type: string, enum: [auto]}
              - {type: object, additionalProperties: {type: string, enum: ["+", "-"]}}
            default: auto
          strand_reference_genes: {$ref: "#/$defs/gene_list_ref", default: strand_reference_genes}
      qc:
        type: object
        additionalProperties: false
        required: [multiqc]
        properties:
          multiqc:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [id, file]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$", description: Report id (names the decoded files in 01_ingest/multiqc/).}
                file:
                  type: string
                  description: >-
                    MultiQC HTML report with embedded compressed plot data (MultiQC 1.x; tested with 1.12 and 1.13).
                read:
                  type: string
                  enum: [r1, r2]
                  description: >-
                    The report holds FastQC on raw reads of this mate: its FastQC metrics get the suffix _r1/_r2 and
                    r1 gives raw_read_pairs. FastQC sections of reports without `read` are not read.
          sample_aliases:
            type: object
            additionalProperties: {type: string}
            description: >-
              MultiQC sample name -> input_column, for names that do not contain the input_column (by default a
              MultiQC name belongs to the one sample whose input_column it contains).
      checksums:
        type: object
        additionalProperties: false
        required: [file]
        properties:
          file: {type: string}
          exclude: {type: array, items: {type: string}, default: []}

  resources:
    type: object
    default: {}
    additionalProperties: false
    properties:
      cache_dir: {type: string, default: resources}
      items:
        description: >
          Resources fetched by the fetch_resources rule into cache_dir. 'source' is a URL or file:// path;
          'md5' (optional) is checked after retrieval. Analysis rules only read the cache.
        type: object
        additionalProperties:
          type: object
          required: [source]
          properties:
            source: {type: string}
            md5: {type: string, pattern: "^[0-9a-f]{32}$"}
            version: {type: string}
            kind:
              type: string
              enum: [gtf, msigdb_export, hpa_immune_cell, hpa_single_cell, fasta, kegg_pathways, tsv]
      gene_lists:
        description: Named gene lists (TSV with columns list, gene_symbol, source). Package defaults are in inst/extdata/gene_lists/.
        type: array
        items: {type: string}
        default: []

  annotation:
    type: object
    default: {}
    additionalProperties: false
    properties:
      gtf: {type: string, default: gtf, description: Key of the GTF in resources.items.}
      id_type: {type: string, enum: [ensembl_gene_id, gene_symbol, entrez_id], default: ensembl_gene_id}
      symbol_source:
        type: string
        enum: [annotation, abundance]
        default: annotation
        description: Where gene_symbol comes from when both are present.

  gene_filter:
    description: Default gene filter for count-based modules (modules may override).
    type: object
    default: {}
    additionalProperties: false
    properties:
      biotypes: {type: array, items: {type: string}, default: [protein_coding, lncRNA]}
      exclude_mitochondrial: {type: boolean, default: true}
      min_cpm: {type: number, default: 2}
      min_samples: {type: integer, default: 2}
      sex_genes: {type: string, enum: [keep, drop_xist_y, drop_xy], default: drop_xist_y}

  contrasts:
    description: Contrasts computed from counts.
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [id, numerator, denominator]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_]+$"}
        numerator: {type: array, items: {type: string}, description: sample_ids, or "factor=level".}
        denominator: {type: array, items: {type: string}}
        label: {type: string}

  contrast_pairs:
    description: Pairs of contrasts expected to share an effect (used by concordance and gene-set concordance).
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [id, first, second]
      properties:
        id: {type: string}
        first: {type: string, description: Contrast id (keys x/y are avoided because YAML 1.1 reads 'y' as a boolean).}
        second: {type: string}
        label: {type: string}

  designs:
    description: Model designs for inferential DE (module de_test) and dispersion estimates.
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [id, formula]
      properties:
        id: {type: string}
        formula: {type: string, description: e.g. "~ patient + condition"}
        contrast: {type: array, items: {type: string}, minItems: 3, maxItems: 3}
        engine: {type: string, enum: [deseq2], default: deseq2}

  thresholds:
    type: object
    default: {}
    additionalProperties: false
    properties:
      padj: {type: number, default: 0.05}
      abs_fold_change: {type: number, default: 1.5, description: Linear |fold change|; log2 threshold is derived.}
      posterior_prob: {type: number, default: 0.8}

  modules:
    type: object
    additionalProperties: false
    default: {}
    properties:
      qc:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          top_n_share: {type: integer, default: 50}
          top_n_list: {type: integer, default: 15}
          ribosomal_protein_regex: {type: string, default: "^RP[SL][0-9]+[A-Z]?[0-9]*$"}
          hemoglobin_genes: {$ref: "#/$defs/gene_list_ref", default: hemoglobin}
          rrna_biotypes: {type: array, items: {type: string}, default: [rRNA, Mt_rRNA, rRNA_pseudogene]}
          figure_metrics:
            type: array
            items: {type: string}
            description: Metrics shown in the qc_metrics figure (absent ones are skipped).
            default: [library_size, genes_count_ge10, pct_counts_mito, pct_counts_rrna, pct_counts_protein_coding,
                      pct_counts_top50_genes]
      pca:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          transforms: {type: array, items: {type: string, enum: [vst, logcpm_tmm]}, default: [vst, logcpm_tmm]}
          ntop: {type: array, items: {type: [integer, string]}, default: [500, 1000, 2000, all]}
          sex_gene_variants: {type: array, items: {type: string}, default: [keep, drop_xist_y, drop_xy]}
          gene_subsets: {type: array, items: {type: string}, default: [all]}
          symbol_exclusion_variants:
            type: array
            items: {type: string}
            default: []
            description: >
              Regexes on gene symbols (e.g. "^HLA-"); each adds a variant of the grid without the matching genes,
              besides the variant without exclusion.
          thinning:
            type: boolean
            default: false
            description: Adds a variant on counts thinned to the smallest library (edgeR::thinCounts, project.seed).
          separation_factors:
            type: array
            items: {type: string}
            default: []
            description: "Factors labelled in pca_summary (default: all samples.factors, in order)."
          orient_pc1:
            type: [object, "null"]
            default: null
            additionalProperties: false
            description: Orients PC1 so that samples at this level have positive mean score (drivers, pc1_order).
            required: [factor, level]
            properties:
              factor: {type: string}
              level: {type: string}
          abundance_sex_genes: {type: string, enum: [keep, drop_xist_y, drop_xy], default: keep}
          scores_ntop: {type: [integer, string], default: 1000}
          pc_drivers: {type: boolean, default: true}
          qc_metrics_for_drivers: {type: array, items: {type: string}, default: []}
          top_loadings: {type: integer, default: 40}
      markers:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          panels: {type: string, default: marker_panels}
          pseudocount: {type: number, default: 1}
          ratios:
            type: array
            default: []
            items:
              type: object
              properties:
                id: {type: string}
                numerator_gene: {type: string}
                denominator_gene: {type: string}
                numerator_sample: {type: string}
                denominator_sample: {type: string}
      contamination:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          profiles:
            type: array
            default: []
            description: Gene profiles of contaminating (or reference) cells, scored per sample on CPM of all genes.
            items:
              type: object
              additionalProperties: false
              required: [id, genes]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                genes: {$ref: "#/$defs/gene_list_ref"}
          reference_profile:
            type: [string, "null"]
            default: null
            description: Profile id whose CPM sum is also reported relative to the sample with the largest value (rel_to_max).
          ratio_pseudocount: {type: number, minimum: 0, default: 1, description: CPM added before the log2 ratios of ratio_checks.}
          ratio_checks:
            type: array
            default: []
            description: Per-gene log2 CPM ratios between two samples over a profile's genes.
            items:
              type: object
              additionalProperties: false
              required: [id, profile, numerator_sample, denominator_sample]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                profile: {type: string}
                numerator_sample: {type: string}
                denominator_sample: {type: string}
          excess_checks:
            type: array
            default: []
            description: >-
              CPM of genes above the mean of baseline_samples, divided by the CPM sum of a profile, in two samples,
              and the ratio of the two excesses (a similar ratio for genes and profile is compatible with the genes
              coming from the profile's cells).
            items:
              type: object
              additionalProperties: false
              required: [id, genes, profile, baseline_samples, samples]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                genes: {$ref: "#/$defs/gene_list_ref"}
                profile: {type: string}
                baseline_samples: {type: array, items: {type: string}, minItems: 1}
                samples: {type: array, items: {type: string}, minItems: 2, maxItems: 2}
          mask:
            type: object
            additionalProperties: false
            default: {}
            description: >-
              masked = (in any include group and in no exclude group) or among the genes of add_profiles. Groups are
              gene sets of an MSigDB export (resource); their genes match by Ensembl ID (by symbol when
              annotation.id_type is gene_symbol).
            properties:
              resource: {type: [string, "null"], default: null, description: Key of an msigdb_export in resources.items.}
              include:
                type: array
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required: [id, sets]
                  properties:
                    id: {type: string, pattern: "^[a-z0-9_]+$"}
                    sets: {type: array, items: {type: string}, minItems: 1}
              exclude:
                type: array
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required: [id, sets]
                  properties:
                    id: {type: string, pattern: "^[a-z0-9_]+$"}
                    sets: {type: array, items: {type: string}, minItems: 1}
              add_profiles: {type: array, items: {type: string}, default: []}
      contamination_sets:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          method: {type: string, enum: [camera_pr], default: camera_pr}
          inter_gene_cor: {type: number, default: 0.01}
      reference:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          profiles:
            type: array
            default: []
            description: >-
              Reference expression of one cell type from an HPA export: nTPM for kind hpa_immune_cell, nCPM for
              hpa_single_cell (kind of the resource in resources.items).
            items:
              type: object
              additionalProperties: false
              required: [id, resource, cell]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                resource: {type: string, description: Key in resources.items.}
                cell: {type: string, description: Value of the 'Immune cell' or 'Cell type' column.}
          target: {type: [string, "null"], default: null, description: Profile id of the target cells.}
          contaminants: {type: array, items: {type: string}, default: [], description: Profile ids of contaminating cells.}
          min_target_expr: {type: number, default: 1, description: "target_expressed: target value >= this."}
          contam_min: {type: number, default: 20, description: "contam_sensitive: max contaminant value >= this ..."}
          contam_fold: {type: number, default: 5, description: "... and >= contam_fold x (target + 1)."}
          exclusion_candidates:
            $ref: "#/$defs/gene_list_ref"
            default: []
            description: Genes (protein-coding) whose inclusion in the universe, or the reason for exclusion, is reported.
      deconvolution:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          components: {type: object, default: {}}
          marker_min_expr: {type: number, default: 50}
          marker_specificity: {type: number, default: 10}
          solver: {type: string, enum: [optim_lbfgsb, lawson_hanson], default: optim_lbfgsb}
          variants: {type: array, default: []}
      contrasts:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          estimators: {type: array, items: {type: string, enum: [logcpm_difference, deseq2_apeglm]}, default: [logcpm_difference]}
          prior_count: {type: number, default: 2}
          norm_method: {type: string, enum: [TMM, RLE, upperquartile, none, reference], default: TMM}
          reference_genes: {oneOf: [{type: "null"}, {$ref: "#/$defs/gene_list_ref"}], default: null}
          dispersion_design: {type: [string, "null"], default: null}
          spread_subsets: {type: array, items: {type: string}, default: [all], description: Gene subsets of contrast_spread.}
          spread_threshold: {type: number, default: 1}
      de_test:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          prefilter:
            type: object
            default: {min_count: 10, min_samples: 3}
            additionalProperties: false
            description: Genes with at least min_count reads in at least min_samples samples are tested.
            properties:
              min_count: {type: integer, minimum: 0}
              min_samples: {type: integer, minimum: 1}
          results_alpha:
            type: number
            default: 0.1
            description: alpha of DESeq2::results(), the FDR target of independent filtering (DESeq2 default 0.1).
          compare_with:
            type: array
            default: []
            description: Computed design vs imported contrast table, reported in provider_comparison.
            items:
              type: object
              required: [design, contrast_table]
              additionalProperties: false
              properties:
                design: {type: string}
                contrast_table: {type: string}
      concordance:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          thresholds: {$ref: "#/$defs/threshold_list", default: [0.58, 1]}
          subsets: {type: array, items: {type: string}, default: [all]}
      geneset_test:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          methods: {type: array, items: {type: string, enum: [camera_pr, fgsea]}, default: [camera_pr]}
          collections: {type: array, items: {type: string}, default: [H]}
          min_size: {type: integer, default: 15}
          max_size: {type: integer, default: 500}
          inter_gene_cor: {type: array, items: {type: number}, default: [0.01]}
          use_ranks: {type: array, items: {type: boolean}, default: [false]}
          fgsea_tie_jitter_sd: {type: number, default: 1.0e-6}
          universes: {type: array, items: {type: string}, default: [all]}
          alpha: {type: number, default: 0.05}
      ora:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          databases: {type: array, items: {type: string, enum: [GO_BP, GO_CC, GO_MF, KEGG, Reactome]}, default: [GO_BP, GO_CC, GO_MF, KEGG, Reactome]}
          p_adjust_method: {type: string, default: BH}
          pvalue_cutoff: {type: number, default: 0.05}
          show_category: {type: integer, default: 15}
      volcano:
        type: object
        default: {}
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          label_top: {type: integer, default: 15}
      signatures:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          methods: {type: array, items: {type: string, enum: [zscore, ssgsea, singscore]}, default: [zscore, singscore]}
          sets: {type: array, items: {type: string}, default: []}
          composites: {type: array, default: []}
          min_size: {type: integer, default: 10}
          universes: {type: array, items: {type: string}, default: [all]}
      pairing:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          sex_genes: {$ref: "#/$defs/gene_list_ref", default: sex_genes}
          xist_genes: {$ref: "#/$defs/gene_list_ref", default: xist}
          group_column:
            type: [string, "null"]
            default: null
            description: >-
              Sample sheet column with the hypothesised donor or pool (equal values = same donor). Its pairs are
              labelled in fingerprint_distances and checked in pairing_summary.
          across_factor:
            type: [string, "null"]
            default: null
            description: Two-level factor that each donor is expected to span (e.g. the sorted fraction).
          fingerprint_variants:
            type: array
            default: [{id: fingerprint, genes: fingerprint_genes}]
            items:
              type: object
              additionalProperties: false
              required: [id, genes]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                genes: {$ref: "#/$defs/gene_list_ref"}
                normalization:
                  type: string
                  enum: [cpm, cpm_tmm]
                  default: cpm
                  description: CPM on all genes, or TMM-normalised CPM on the genes kept by gene_filter (sex genes kept).
                min_total_count: {type: integer, minimum: 0, default: 0, description: Genes with fewer reads over all samples are dropped.}
          male_reference_samples:
            type: array
            items: {type: string}
            default: []
            description: >-
              sample_ids taken as all-male material (XIST about 0); male fractions are relative to their mean. Empty:
              the male fraction is not estimated.
          sex_denominators:
            type: array
            default: [{id: chr_y}]
            items:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                numerator:
                  $ref: "#/$defs/gene_list_ref"
                  description: Genes summed in the numerator (default the chrY genes of sex_genes).
                denominator:
                  $ref: "#/$defs/gene_list_ref"
                  description: Genes summed in the denominator (default none).
      power:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          design: {type: [string, "null"], default: null, description: "Id of a designs[] entry (default: the first)."}
          universes:
            type: array
            default: [{id: all, subset: all}]
            description: >-
              Gene sets of the BCV, as subset expressions over the filtered genes (e.g. in_reference_universe+no_masked);
              estimated in this order on one random stream.
            items:
              type: object
              additionalProperties: false
              required: [id, subset]
              properties:
                id: {type: string, pattern: "^[a-z0-9_]+$"}
                subset: {type: string}
          bootstrap_replicates: {type: integer, minimum: 1, default: 200}
          reference_scenario:
            type: object
            additionalProperties: false
            default: {}
            description: Scenario of the n_hart_* columns of the bcv table.
            properties:
              mu: {type: number, default: 100}
              fold_change: {type: number, default: 2}
              alpha: {type: number, default: 0.01}
          grid:
            type: object
            additionalProperties: false
            default: {}
            properties:
              cv: {type: array, items: {type: number}, default: [0.2, 0.3, 0.4, 0.6]}
              cv_labels:
                type: array
                items: {type: string}
                default: []
                description: One label per cv value (the assumption behind it); empty for none.
              mu: {type: array, items: {type: number}, default: [20, 100]}
              fold_change: {type: array, items: {type: number}, default: [1.5, 2]}
              alpha: {type: array, items: {type: number}, default: [0.01, 0.001]}
              power: {type: number, default: 0.8}
      coverage:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          target_genes: {$ref: "#/$defs/gene_list_ref", default: []}
          normalizer_genes: {$ref: "#/$defs/gene_list_ref", default: []}
          flank_bp: {type: integer, default: 10000}
          window_bp: {type: integer, default: 500}
      covariates:
        type: object
        default: {}
        properties:
          enabled: {type: boolean, default: true}
          spline_df: {type: integer, default: 4}
          strata: {type: array, items: {type: string}, default: [ge_median, ge_q75, all]}

  export:
    type: object
    additionalProperties: false
    default: {}
    properties:
      xlsx: {type: boolean, default: false}
