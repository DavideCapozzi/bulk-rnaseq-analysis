# Project config created by `bulkrnaseq init` (scenario: de_only). Paths resolve against this folder.
# Provider DE tables go in <project>/input/ (read-only); no sample sheet is needed. Then:
#   bulkrnaseq fetch config/config.yaml
#   bulkrnaseq plan  config/config.yaml
#   bulkrnaseq run   config/config.yaml
project:
  name: {{name}}
  organism: human
  output_dir: ../results
  seed: 1
toolkit:
  version: "{{toolkit_version}}"
inputs:
  base_dir: ../../../input
  contrast_tables:
    - {id: contrast_1, adapter: deseq2, file: Comparison.xlsx, sheet: DESeq2_results,
       numerator: treated, denominator: control}
annotation:
  gtf: gtf
  id_type: gene_symbol
thresholds: {padj: 0.05, abs_fold_change: 1.5}
resources:
  cache_dir: ../resources
  items:
    gtf: {source: "https://ftp.ensembl.org/pub/release-115/gtf/homo_sapiens/Homo_sapiens.GRCh38.115.gtf.gz", md5: 9b6e2a4cda2a01f6054a974428a7673c, version: Ensembl 115, kind: gtf}
    kegg_pathways: {source: kegg_rest, kind: kegg_pathways}
export:
  xlsx: true
