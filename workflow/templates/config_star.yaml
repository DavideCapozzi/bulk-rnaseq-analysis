# Project config created by `bulkrnaseq init` (scenario: star). Paths resolve against this folder.
# Provider files go in <project>/input/ (read-only). Fill samples.tsv, factors and contrasts, then:
#   bulkrnaseq fetch config/config.yaml   (downloads the resources once)
#   bulkrnaseq plan  config/config.yaml   (which modules run, and why the others are skipped)
#   bulkrnaseq run   config/config.yaml
project:
  name: {{name}}
  organism: human
  output_dir: ../results
  seed: 1
toolkit:
  version: "{{toolkit_version}}"
samples:
  sheet: samples.tsv
  factors:
    condition: [control, treated]
  label_column: label
inputs:
  base_dir: ../../../input
  counts:
    adapter: star_reads_per_gene
    files: "raw_counts/{input}_ReadsPerGene.out.tab"
    strand_column: reverse
  abundance:
    adapter: stringtie_gene_abundance
    files: "FPKM/{input}_StringTie.gene_abundance.tab"
resources:
  cache_dir: ../resources
  items:
    gtf: {source: "https://ftp.ensembl.org/pub/release-115/gtf/homo_sapiens/Homo_sapiens.GRCh38.115.gtf.gz", md5: 9b6e2a4cda2a01f6054a974428a7673c, version: Ensembl 115, kind: gtf}
annotation:
  gtf: gtf
  id_type: ensembl_gene_id
contrasts: []
designs: []
